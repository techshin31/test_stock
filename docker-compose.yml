services:
  ############################################################
  # 1. PostgreSQL Database
  ############################################################
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quantpilot_db}
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:5433:5432"
    volumes:
      - ./storage/postgres/database:/var/lib/postgresql/data
      - ./storage/postgres/schema/01_codes_schema.sql:/docker-entrypoint-initdb.d/01_codes_schema.sql:ro
      - ./storage/postgres/schema/02_codes_seed.sql:/docker-entrypoint-initdb.d/02_codes_seed.sql:ro
      - ./storage/postgres/schema/03_user_schema.sql:/docker-entrypoint-initdb.d/03_user_schema.sql:ro
      - ./storage/postgres/schema/04_trader_schema.sql:/docker-entrypoint-initdb.d/04_trader_schema.sql:ro
      - ./storage/postgres/schema/05_market_data_schema.sql:/docker-entrypoint-initdb.d/05_market_data_schema.sql:ro
      - ./storage/postgres/schema/06_fa_analysis_schema.sql:/docker-entrypoint-initdb.d/06_fa_analysis_schema.sql:ro
      - ./storage/postgres/schema/07_strategy_seed.sql:/docker-entrypoint-initdb.d/07_strategy_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ############################################################
  # 2. FastAPI Backend Service
  ############################################################
  api:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: quantpilot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      TZ: Asia/Seoul
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./api:/app/api
      - ./core:/app/core
      - ./storage:/app/storage
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  ############################################################
  # 3. PAPER Trader Scheduler Daemon
  ############################################################
  trader:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: quantpilot-trader
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "core.utils.scheduler_supervisor", "--mode", "PAPER"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KIS_ENV: paper
      ALLOW_LIVE_ORDER: "false"
      QUANTPILOT_RUNTIME_ID: paper-trader
      TZ: Asia/Seoul
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m core.utils.runtime_health --quiet || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 25s

  ############################################################
  # 4. React Web Console Dashboard (Nginx)
  ############################################################
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: quantpilot-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HOST_BIND:-127.0.0.1}:3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
